name: Release Windows App

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Verify tag matches app version
      shell: pwsh
      run: |
        $packageVersion = node -p "require('./package.json').version"
        if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
          throw "Release tags must use stable semantic versions such as v1.2.3"
        }
        if ("v$packageVersion" -ne "${{ github.ref_name }}") {
          throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
        }

    - name: Verify source
      run: npm run verify

    - name: Build release assets
      run: npm run build -- --publish never

    - name: Create GitHub Release and upload assets
      shell: pwsh
      run: |
        $updateFileName = Get-Content dist/latest.yml |
          Where-Object { $_ -match '^path:\s*(.+)$' } |
          ForEach-Object { $Matches[1].Trim() } |
          Select-Object -First 1

        if ([string]::IsNullOrWhiteSpace($updateFileName)) {
          throw "Unable to read update path from dist/latest.yml"
        }

        $installer = Get-Item (Join-Path dist $updateFileName)
        $blockmap = Get-Item "$($installer.FullName).blockmap"
        $assets = @($installer, $blockmap, (Get-Item dist/latest.yml))

        gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title "Vibe Calendar ${{ github.ref_name }}" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub Release" }
        }

        foreach ($asset in $assets) {
          gh release upload "${{ github.ref_name }}" $asset.FullName `
            --repo "${{ github.repository }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload $($asset.Name)" }
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: Vibe-Calendar-${{ github.ref_name }}-Windows
        path: |
          dist/*.exe
          dist/*.blockmap
          dist/latest.yml
        if-no-files-found: error
        retention-days: 14
