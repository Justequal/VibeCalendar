<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 只允许本地脚本/样式，并明确限制节假日数据的联网范围。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://cdn.jsdelivr.net https://raw.githubusercontent.com https://timor.tech; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>VibeCalendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="app-container">
    
    <!-- 顶部标题栏区域 (专门用于无边框窗口的拖拽) -->
    <div class="title-bar">
      <!-- 隐藏的拖拽响应区 -->
      <div class="drag-region"></div>
      <!-- 仿原生的关闭按钮 -->
      <button id="close-btn" class="close-btn" aria-label="关闭窗口" title="关闭">×</button>
    </div>
    
    <!-- 日历头部区：包含月份显示与左右翻页按钮 -->
    <div class="calendar-header">
      <button id="prev-month" class="nav-btn" aria-label="上个月" title="上个月（←）">←</button>
      <div class="header-center">
        <h1 id="month-year">年月</h1>
        <div class="header-controls">
          <!-- 切换一星期的首日 (周一/周日) 按钮 -->
          <button id="toggle-week-btn" class="toggle-week-btn" aria-label="切换一周起始日">首日：周一</button>
          <button id="language-toggle-btn" class="toggle-week-btn language-toggle-btn" aria-label="切换到英文" title="切换到英文">EN</button>
        </div>
      </div>
      <button id="next-month" class="nav-btn" aria-label="下个月" title="下个月（→）">→</button>
    </div>

    <!-- 星期表头行 (日, 一, 二, 三...) -->
    <div class="weekdays" id="weekdays-container" aria-hidden="true">
      <!-- 这一块内容会由 JavaScript 动态生成渲染 -->
    </div>

    <div id="calendar-legend" class="calendar-legend" aria-label="标记说明">
      <span><i class="legend-dot festival-dot"></i><span id="festival-legend">节日</span></span>
      <span><i class="legend-badge day-off-badge"></i><span id="day-off-legend">休假</span></span>
      <span><i class="legend-badge workday-badge"></i><span id="workday-legend">补班</span></span>
    </div>

    <!-- 核心日历网格区 (42 个格子的日期区) -->
    <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="月历">
      <!-- 具体的日期方块都会被 renderer.js 渲染后插入这里 -->
    </div>

    <!-- 底部功能栏：展示时钟与版本号（点击可打开当前版本说明），以及手动检查更新按钮与回到今天按钮 -->
    <div class="footer">
      <div class="footer-info">
        <div id="clock" class="clock">00:00:00</div>
        <!-- 版本号按钮：点击展示当前安装版本的说明模态框 -->
        <button id="version-btn" class="version-btn" title="查看当前版本说明">v…</button>
      </div>
      <div class="footer-actions">
        <!-- 手动检查更新按钮 -->
        <button id="check-update-btn" class="update-btn">检查更新</button>
        <button id="go-today-btn" class="today-btn" title="快捷键 T">回到今天</button>
      </div>
    </div>

    <!-- 当前版本说明模态弹窗 -->
    <div id="release-modal" class="release-modal" hidden>
      <section class="release-card" role="dialog" aria-modal="true" aria-labelledby="release-title">
        <header class="release-header">
          <div>
            <h2 id="release-title">当前版本说明</h2>
            <p id="release-version" class="release-version"></p>
          </div>
          <button id="release-close-btn" class="release-close-btn" aria-label="关闭版本说明">×</button>
        </header>
        <div id="release-notes" class="release-notes">正在加载…</div>
      </section>
    </div>
  </div>

  <!-- 加载顺序：领域逻辑与词典 → 数据服务与独立功能控制器 → 页面渲染。 -->
  <script src="calendar-core.js"></script>
  <script src="interaction-core.js"></script>
  <script src="translations.js"></script>
  <script src="holidays.js"></script>
  <script src="update-controller.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
