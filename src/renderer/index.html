<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 只允许本地脚本/样式，并明确限制节假日数据的联网范围。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://cdn.jsdelivr.net https://raw.githubusercontent.com https://timor.tech; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Vibe Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="app-container">
    
    <!-- 顶部标题栏区域 (专门用于无边框窗口的拖拽) -->
    <div class="title-bar">
      <!-- 隐藏的拖拽响应区 -->
      <div class="drag-region"></div>
      <!-- 仿原生的关闭按钮 -->
      <button id="close-btn" class="close-btn" aria-label="关闭窗口" title="关闭">×</button>
    </div>
    
    <!-- 日历头部区：包含月份显示与左右翻页按钮 -->
    <div class="calendar-header">
      <button id="prev-month" class="nav-btn" aria-label="上个月" title="上个月（←）">←</button>
      <div class="header-center">
        <h1 id="month-year">Month Year</h1>
        <!-- 切换一星期的首日 (周一/周日) 按钮 -->
        <button id="toggle-week-btn" class="toggle-week-btn" aria-label="切换一周起始日">1st: Sun</button>
      </div>
      <button id="next-month" class="nav-btn" aria-label="下个月" title="下个月（→）">→</button>
    </div>

    <!-- 星期表头行 (日, 一, 二, 三...) -->
    <div class="weekdays" id="weekdays-container" aria-hidden="true">
      <!-- 这一块内容会由 JavaScript 动态生成渲染 -->
    </div>

    <!-- 核心日历网格区 (42 个格子的日期区) -->
    <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="月历">
      <!-- 具体的日期方块都会被 renderer.js 渲染后插入这里 -->
    </div>

    <!-- 底部功能栏：包含数字时钟与"回到今天"快捷按钮 -->
    <div class="footer">
      <div id="clock" class="clock">00:00:00</div>
      <button id="go-today-btn" class="today-btn" title="快捷键 T">Go to Today</button>
    </div>
  </div>

  <!-- 加载顺序：纯日期逻辑 → 节假日数据服务 → 界面控制器。 -->
  <script src="calendar-core.js"></script>
  <script src="holidays.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
