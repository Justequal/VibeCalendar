<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Calendar</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Title bar for dragging the frameless window -->
    <div class="title-bar">
      <div class="drag-region"></div>
      <button id="close-btn" class="close-btn">×</button>
    </div>
    
    <!-- Calendar Header -->
    <div class="calendar-header">
      <button id="prev-month" class="nav-btn">←</button>
      <div class="header-center">
        <h1 id="month-year">Month Year</h1>
        <button id="toggle-week-btn" class="toggle-week-btn">1st: Sun</button>
      </div>
      <button id="next-month" class="nav-btn">→</button>
    </div>

    <!-- Weekdays Header -->
    <div class="weekdays" id="weekdays-container">
      <!-- Generated by JS -->
    </div>

    <!-- Calendar Days Grid -->
    <div id="calendar-grid" class="calendar-grid">
      <!-- Days will be generated by renderer.js -->
    </div>

    <!-- Footer: Clock & Today Button -->
    <div class="footer">
      <div id="clock" class="clock">00:00:00</div>
      <button id="go-today-btn" class="today-btn">Go to Today</button>
    </div>
  </div>

  <script src="holidays.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
